<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar Conta – Cupcake Haven</title>
  <meta name="description" content="Criar uma conta">
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
  <!-- T05 – Cadastro -->
  <main id="conteudo" class="conteudo" tabindex="-1">
    <div id="alerta" class="alerta alerta-erro" role="alert" hidden></div>
    <form id="form-cadastro" novalidate>
      <div class="campo">
        <label for="nome">Nome completo</label>
        <input id="nome" name="nome" required maxlength="100" autocomplete="name" placeholder="Como devemos te chamar?">
      </div>
      <div class="campo">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" required maxlength="120" autocomplete="email" placeholder="seu@email.com">
      </div>
      <div class="campo">
        <label for="telefone">Telefone <span class="opcional">(opcional)</span></label>
        <input id="telefone" name="telefone" type="tel" maxlength="15" autocomplete="tel" placeholder="(11) 98765-4321">
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" required autocomplete="new-password" placeholder="Mínimo de 8 caracteres" aria-describedby="regra-senha">
        <span id="regra-senha" class="dica">Pelo menos 8 caracteres, com letras e números.</span>
      </div>
      <div class="campo">
        <label for="confirmacao_senha">Confirmar senha</label>
        <input id="confirmacao_senha" name="confirmacao_senha" type="password" required autocomplete="new-password" placeholder="Digite a senha novamente">
      </div>
      <button class="botao botao-bloco" type="submit">Criar conta</button>
    </form>
    <p class="centro" style="margin-top:20px"><a id="link-login" class="negrito" href="/pages/login.html">Já tenho conta · Entrar</a></p>
  </main>
  <noscript><p class="alerta alerta-erro">Ative o JavaScript do navegador para usar o sistema.</p></noscript>
  <script type="module" src="/js/pages/cadastro.js"></script>
</body>
</html>
