<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar – App de Cupcakes Gourmet</title>
  <meta name="description" content="Entrar na conta">
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
  <!-- T04 – Login -->
  <main id="conteudo" class="conteudo" tabindex="-1">
    <div class="pilha centro" style="margin:8px 0 20px">
      <div class="marca-logo" style="width:68px;height:68px;margin:0 auto" aria-hidden="true">
        <svg class="icone" style="width:36px;height:36px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M6.5 12.5h11l-1.4 7.2a1 1 0 0 1-1 .8H8.9a1 1 0 0 1-1-.8z"/><path d="M10 12.5l.5 8M14 12.5l-.5 8"/><path d="M5.5 12.5a2.5 2.5 0 0 1 .8-4.8 4 4 0 0 1 3.5-3.4A3 3 0 0 1 12 3a3 3 0 0 1 2.2 1.3 4 4 0 0 1 3.5 3.4 2.5 2.5 0 0 1 .8 4.8z"/></svg>
      </div>
      <h2 style="margin:0;font-size:1.25rem">App de Cupcakes Gourmet</h2>
      <p class="texto-suave" style="margin:0">Entre para finalizar seu pedido</p>
    </div>
    <div id="alerta" class="alerta" role="alert" hidden></div>
    <form id="form-login" novalidate>
      <div class="campo">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="120" placeholder="seu@email.com">
        <div class="erro-campo"></div>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <div class="campo-senha">
          <input id="senha" name="senha" type="password" autocomplete="current-password" placeholder="Sua senha">
          <button type="button" id="mostrar-senha" aria-pressed="false" aria-controls="senha">Mostrar</button>
        </div>
        <div class="erro-campo"></div>
      </div>
      <button class="botao botao-bloco" type="submit">Entrar</button>
    </form>
    <p class="centro" style="margin-top:20px">Não tem conta?<br><a id="link-cadastro" class="negrito" href="/pages/cadastro.html">Criar conta</a></p>
    <p class="centro texto-suave texto-pequeno">Recuperação de senha por e-mail não faz parte desta versão (seção 3.3 do planejamento).
      Se esqueceu a senha, fale com a loja em <a href="/pages/ajuda.html">Ajuda e Suporte</a>.</p>
  </main>
  <noscript><p class="alerta alerta-erro">Ative o JavaScript do navegador para usar o sistema.</p></noscript>
  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
